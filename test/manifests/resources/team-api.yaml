apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: team-api
  labels:
    app: gateway
    team: api
    environment: development
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        team: api
        environment: development
    spec:
      containers:
        - name: gateway
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: team-api
  labels:
    app: gateway
    team: api
    environment: development
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: team-api
  labels:
    app: user-service
    team: api
    environment: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        team: api
        environment: development
    spec:
      containers:
        - name: user-service
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: team-api
  labels:
    app: user-service
    team: api
    environment: development
spec:
  selector:
    app: user-service
  ports:
    - port: 8080
      targetPort: 8080
---
# Pod: Pending via unschedulable node affinity
apiVersion: v1
kind: Pod
metadata:
  name: cache-warmer
  namespace: team-api
  labels:
    app: cache-warmer
    team: api
    environment: development
spec:
  containers:
    - name: cache-warmer
      image: redis:7-alpine
  nodeSelector:
    node-role.kubernetes.io/nonexistent: "true"
---
# Pod: Failed via bad image
apiVersion: v1
kind: Pod
metadata:
  name: debug-tools
  namespace: team-api
  labels:
    app: debug-tools
    team: api
    environment: development
spec:
  containers:
    - name: debug-tools
      image: registry.invalid/knals/debug-tools:latest
  restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: team-api
  labels:
    app: db-migrate
    team: api
    environment: development
spec:
  template:
    metadata:
      labels:
        app: db-migrate
        team: api
    spec:
      containers:
        - name: migrate
          image: busybox:1.37
          command: ["sh", "-c", "echo 'migration complete'; exit 0"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-generator
  namespace: team-api
  labels:
    app: report-generator
    team: api
    environment: development
spec:
  schedule: "0 2 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: report-generator
            team: api
        spec:
          containers:
            - name: report
              image: busybox:1.37
              command: ["sh", "-c", "echo 'generating report'"]
          restartPolicy: Never
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: team-api
  labels:
    app: gateway
    team: api
    environment: development
data:
  LOG_LEVEL: "info"
  RATE_LIMIT: "1000"
  CORS_ORIGINS: "https://app.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: team-api
  labels:
    app: gateway
    team: api
    environment: development
type: Opaque
stringData:
  database-url: "postgresql://app:secret@db.internal:5432/api"
  jwt-signing-key: "dev-only-signing-key-not-for-production"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: team-api
  labels:
    app: gateway
    team: api
    environment: development
spec:
  rules:
    - host: api.knals.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8080
