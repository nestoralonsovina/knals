apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: team-infra
  labels:
    app: prometheus
    team: infra
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        team: infra
        environment: development
    spec:
      containers:
        - name: prometheus
          image: nginx:1.27-alpine
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: team-infra
  labels:
    app: prometheus
    team: infra
    environment: development
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: team-infra
  labels:
    app: alertmanager
    team: infra
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        team: infra
        environment: development
    spec:
      containers:
        - name: alertmanager
          image: nginx:1.27-alpine
          ports:
            - containerPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: team-infra
  labels:
    app: alertmanager
    team: infra
    environment: development
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
# Pod: Pending via unschedulable
apiVersion: v1
kind: Pod
metadata:
  name: log-collector
  namespace: team-infra
  labels:
    app: log-collector
    team: infra
    environment: development
spec:
  containers:
    - name: log-collector
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
  nodeSelector:
    node-role.kubernetes.io/nonexistent: "true"
---
# Pod: Failed via bad image
apiVersion: v1
kind: Pod
metadata:
  name: metrics-exporter
  namespace: team-infra
  labels:
    app: metrics-exporter
    team: infra
    environment: development
spec:
  containers:
    - name: metrics-exporter
      image: registry.invalid/knals/metrics-exporter:latest
  restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-old-metrics
  namespace: team-infra
  labels:
    app: cleanup-old-metrics
    team: infra
    environment: development
spec:
  template:
    metadata:
      labels:
        app: cleanup-old-metrics
        team: infra
    spec:
      containers:
        - name: cleanup
          image: busybox:1.37
          command: ["sh", "-c", "echo 'cleanup complete'; exit 0"]
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-renewal-check
  namespace: team-infra
  labels:
    app: cert-renewal-check
    team: infra
    environment: development
spec:
  schedule: "0 6 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cert-renewal-check
            team: infra
        spec:
          containers:
            - name: cert-check
              image: busybox:1.37
              command: ["sh", "-c", "echo 'checking certs'"]
          restartPolicy: Never
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: team-infra
  labels:
    app: prometheus
    team: infra
    environment: development
data:
  RETENTION_DAYS: "30"
  SCRAPE_INTERVAL: "15s"
  ALERT_CHANNEL: "#ops-alerts"
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: team-infra
  labels:
    app: prometheus
    team: infra
    environment: development
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "dev-grafana-password"
