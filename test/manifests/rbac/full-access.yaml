apiVersion: v1
kind: ServiceAccount
metadata:
  name: full-access
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: full-access
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: full-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: full-access
subjects:
  - kind: ServiceAccount
    name: full-access
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: full-access-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: full-access
type: kubernetes.io/service-account-token
